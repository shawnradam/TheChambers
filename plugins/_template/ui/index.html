<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plugin</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #171515;
        --card: #201e1e;
        --border: rgba(43, 42, 40, 0.83);
        --fg: #dedcd3;
        --muted: #8b8a83;
        --primary: #da702c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 18px;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      }
      h1 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
      p { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
      button {
        height: 30px;
        padding: 0 12px;
        border: 1px solid rgba(218, 112, 44, 0.5);
        border-radius: 7px;
        background: rgba(218, 112, 44, 0.14);
        color: #e59a69;
        font: inherit;
        cursor: pointer;
      }
      pre {
        margin-top: 14px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
        color: var(--fg);
        font: 12px/18px ui-monospace, 'Cascadia Mono', Consolas, monospace;
        white-space: pre-wrap;
      }
      code { color: #a0af53; }
    </style>
  </head>
  <body>
    <h1>Example plugin</h1>
    <p>
      Edit <code>server.mjs</code> and this page, then use <strong>Reload</strong> in
      Settings → Plugins. Routes live under <code>/api/plugin/&lt;id&gt;/</code>.
    </p>
    <button id="call" type="button">Call /hello</button>
    <pre id="out">Ready.</pre>
    <script>
      const id = location.pathname.split('/')[2];
      const out = document.getElementById('out');
      document.getElementById('call').addEventListener('click', async () => {
        out.textContent = 'Calling…';
        try {
          const response = await fetch(`/api/plugin/${id}/hello`);
          out.textContent = JSON.stringify(await response.json(), null, 2);
        } catch (error) {
          out.textContent = String(error);
        }
      });
    </script>
  </body>
</html>
