<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171515" />
    <title>TheChambers — unlock</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/logo-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="login-body">
    <form id="login" class="login-card">
      <img class="login-logo" src="/logo-192.png" alt="TheChambers" />
      <h1>TheChambers</h1>
      <p class="meta">Command Code, from this device.</p>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required />
      <label class="check">
        <input id="trust" type="checkbox" checked />
        Trust this device
      </label>
      <button class="primary" type="submit">Unlock</button>
      <p id="error" class="error" role="alert"></p>
    </form>
    <script src="/login.js"></script>
  </body>
</html>
