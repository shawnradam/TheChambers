<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171515" />
    <title>TheChambers — unlock</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/logo-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="login-body">
    <form id="login" class="login-box">
      <h1>Unlock TheChambers</h1>
      <p>This session is password-protected.</p>
      <div class="login-row">
        <label class="login-input">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
          <input id="password" type="password" placeholder="Enter password" autocomplete="current-password" required />
        </label>
        <button class="login-submit" type="submit" aria-label="Unlock">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
        </button>
      </div>
      <label class="login-trust">
        <input id="trust" type="checkbox" checked />
        Trust this device
      </label>
      <p id="error" class="login-error" role="alert"></p>
    </form>
    <script src="/login.js"></script>
  </body>
</html>
