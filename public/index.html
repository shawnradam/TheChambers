<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171515" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>TheChambers</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="side-top">
          <button id="sidebar-toggle" class="icon-btn" type="button" title="Toggle sidebar">▤</button>
          <button id="new-chat" class="new-session" type="button"><span class="plus">＋</span> New session</button>
        </div>

        <div class="side-tools">
          <button id="search-toggle" class="icon-btn" type="button" title="Search">⌕</button>
          <button id="add-project" class="icon-btn" type="button" title="Add project">▣</button>
          <button id="tab-sessions" class="icon-btn" type="button" title="All sessions">☰</button>
          <button id="logout" class="icon-btn" type="button" title="Sign out">⋯</button>
        </div>

        <div id="search-wrap" class="search-wrap" hidden>
          <input id="search" type="search" placeholder="Search chats and sessions" autocomplete="off" />
        </div>

        <nav id="sidebar-scroll">
          <section class="group">
            <h2>Chats</h2>
            <div id="chat-list" class="items"></div>
          </section>

          <section class="group" id="work-group" hidden>
            <h2>In work</h2>
            <div id="work-list" class="items"></div>
          </section>

          <section class="group">
            <h2>Projects</h2>
            <div id="project-list" class="items"></div>
          </section>
        </nav>

        <footer class="side-foot">
          <span id="workspace" class="meta"></span>
        </footer>
      </aside>

      <main id="main">
        <header id="topbar">
          <button id="menu" class="icon-btn" type="button" aria-label="Sessions">☰</button>
          <div class="tb-title">
            <h1 id="conv-title">New session</h1>
            <div id="conv-meta" class="meta"></div>
          </div>
          <span id="live-pill" class="pill" hidden>live</span>
          <button id="new-chat-top" class="icon-btn" type="button" title="New session">＋</button>
        </header>

        <div id="scroll">
          <section id="empty" class="empty-state">
            <h2>What are we working on?</h2>

            <div class="chooser">
              <span class="chooser-label">Choose project</span>
              <select id="project" aria-label="Project"></select>
            </div>
          </section>

          <section id="messages" aria-live="polite"></section>
        </div>

        <form id="composer">
          <p id="external-note" class="note external" hidden>
            This session is also open in a terminal. Run <code>/resume</code> there to load these messages.
          </p>

          <div class="composer-card">
            <textarea id="input" rows="1" placeholder="Plan, build, or ask." autocomplete="off"></textarea>
            <div class="composer-bar">
              <button id="add-project-bar" class="chip square" type="button" title="Add project">＋</button>
              <select id="mode" class="chip-select" aria-label="Permission mode">
                <option value="read-only">Read-only</option>
                <option value="full">Full access</option>
              </select>
              <span id="model" class="meta model"></span>
              <button id="stop" class="send stop" type="button" aria-label="Stop" hidden>■</button>
              <button id="send" class="send" type="submit" aria-label="Send">↑</button>
            </div>
          </div>

          <div id="suggestions" class="chips">
            <button class="chip" type="button" data-prompt="Explore the codebase and tell me how it is structured.">Explore the codebase</button>
            <button class="chip" type="button" data-prompt="Catch me up on what changed recently in this project.">Catch me up</button>
            <button class="chip" type="button" data-prompt="Weigh the options for what I should do next here.">Weigh my options</button>
            <button class="chip" type="button" data-prompt="Help me plan a feature for this project.">Start feature planning</button>
            <button class="chip" type="button" data-prompt="Debug the current issue in this project.">Debug an issue</button>
            <button class="chip" type="button" data-prompt="Review my uncommitted changes.">Review my changes</button>
          </div>
        </form>
      </main>

      <div id="scrim" hidden></div>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
