<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171515" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="author" content="Shawn Radam" />
    <meta name="founder" content="Shawn Radam" />
    <meta name="copyright" content="Copyright (C) 2026 Shawn Radam" />

    <meta name="source" content="https://github.com/shawnradam/TheChambers" />
    <title>TheChambers</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/logo-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <svg id="sprite" aria-hidden="true">

      <symbol id="i-chat-new" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.9-.9L3 20.5l1.5-4.6a8.4 8.4 0 1 1 16.5-4.4Z" /><path d="M12 8v7M8.5 11.5h7" /></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" /><path d="m16 16 4.5 4.5" /></symbol>
      <symbol id="i-folder-plus" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z" /><path d="M12 10v6M9 13h6" /></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" /><circle cx="16" cy="7" r="2" /><circle cx="8" cy="17" r="2" /></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.1" fill="currentColor" stroke="none" /><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none" /><circle cx="19" cy="12" r="1.1" fill="currentColor" stroke="none" /></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.15.5.55.9 1.05 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z" /></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v10M8 10.5 12 14l4-3.5M5 19h14" /></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6.4" /><path d="M20 5v6h-6" /></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><circle cx="8.5" cy="9" r="1.5" /><path d="m4 17 5-5 4 4 3-3 4 4" /></symbol>
      <symbol id="i-concise" viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h13" /></symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5" /></symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m10 7 5 5-5 5" /></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12 20 4l-5 16-3.5-6.5L4 12Z" /></symbol>
      <symbol id="i-plus-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 8v8M8 12h8" /></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.4 3 8.2 7 10 4-1.8 7-5.6 7-10V6l-7-3Z" /><path d="M12 9v4" /><circle cx="12" cy="15.6" r=".5" fill="currentColor" stroke="none" /></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10" /></symbol>
      <symbol id="i-archive" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1" /><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M10 12h4" /></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" /></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4ZM14 6l4 4" /></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6V3Z" /><path d="M14 3v4h4" /></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z" /></symbol>
      <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="m7 9 3 3-3 3M13 15h4" /></symbol>
      <symbol id="i-git" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.4" /><circle cx="6" cy="18" r="2.4" /><circle cx="18" cy="8" r="2.4" /><path d="M6 8.4v7.2M18 10.4c0 3-2.4 4-5 4.6" /></symbol>
      <symbol id="i-diff" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" /><path d="M12 3v18M8 8H5M8 12H5M16 16h3" /></symbol>
      <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z" /><path d="M9 4v14M15 6v14" /></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3c2.5 2.5 3.8 5.6 3.8 9S14.5 18.5 12 21c-2.5-2.5-3.8-5.6-3.8-9S9.5 5.5 12 3Z" /></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h5v17H6a2 2 0 0 0-2 2V5Z" /><path d="M20 5a2 2 0 0 0-2-2h-5v17h5a2 2 0 0 1 2 2V5Z" /></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6.3" /><path d="M20 5v6h-6" /></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2" /></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2" /><path d="M5 15V6a2 2 0 0 1 2-2h9" /></symbol>
      <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></symbol>
      <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" /><path d="M10 2v3M14 2v3M10 19v3M14 19v3M2 10h3M2 14h3M19 10h3M19 14h3" /></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><circle cx="5" cy="6" r="1.35" fill="currentColor" stroke="none" /><circle cx="5" cy="12" r="1.35" fill="currentColor" stroke="none" /><circle cx="5" cy="18" r="1.35" fill="currentColor" stroke="none" /><path d="M9.2 6h11M9.2 12h11M9.2 18h11" /></symbol>
      <symbol id="i-message" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.9-.9L3 20.5l1.5-4.6a8.4 8.4 0 1 1 16.5-4.4Z" /></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z" /><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z" /></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2" /><path d="M8 10V7a4 4 0 0 1 8 0v3" /></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z" /><circle cx="12" cy="12" r="2.5" /></symbol>
      <symbol id="i-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none" /></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6V3Z" /><path d="M14 3v4h4M9 12h7M9 16h5" /></symbol>
    </svg>

    <div id="app">
      <div class="shell">
        <aside id="sidebar">
          <div class="brand-row" aria-label="TheChambers">
            <span class="brand-stars" aria-hidden="true"><span>✦</span><span>✧</span><span>✦</span></span>
            <span class="brand-word">THECHAMBERS</span>
          </div>

          <div class="sb-head">
            <button id="sidebar-toggle" class="icon-btn" type="button" title="Toggle sidebar" aria-label="Toggle sidebar"><svg class="icon"><use href="#i-panel-left" /></svg></button>
            <button id="new-chat" class="new-session" type="button"><svg class="icon"><use href="#i-chat-new" /></svg><span>New session</span></button>
            <span class="spacer"></span>
            <button id="sidebar-close" class="icon-btn only-mobile" type="button" aria-label="Close"><svg class="icon"><use href="#i-x" /></svg></button>
          </div>

          <div class="sb-tools">
            <button id="search-toggle" class="icon-btn" type="button" title="Search sessions" aria-label="Search sessions"><svg class="icon"><use href="#i-search" /></svg></button>
            <button id="add-project" class="icon-btn" type="button" title="Add project" aria-label="Add project"><svg class="icon"><use href="#i-folder-plus" /></svg></button>
            <button id="shortcuts" class="icon-btn" type="button" title="Keyboard shortcuts" aria-label="Keyboard shortcuts"><svg class="icon"><use href="#i-sliders" /></svg></button>
            <button id="more" class="icon-btn" type="button" title="More" aria-label="More"><svg class="icon"><use href="#i-more" /></svg></button>
          </div>

          <div id="search-wrap" class="search-wrap" hidden>
            <svg class="icon"><use href="#i-search" /></svg>
            <input id="search" type="search" placeholder="Search chats and sessions" autocomplete="off" />
          </div>

          <nav id="sidebar-scroll">
            <section class="group">
              <div class="group-head">
                <span>Chats</span>
                <button id="new-chat-group" class="mini" type="button" title="New session"><svg class="icon"><use href="#i-plus" /></svg></button>
              </div>
              <div id="chat-list" class="items"></div>
            </section>

            <section class="group" id="work-group" hidden>
              <div class="group-head"><span>In work</span></div>
              <div id="work-list" class="items"></div>
            </section>

            <section class="group">
              <div class="group-head">
                <span>Projects</span>
                <button id="add-project-group" class="mini" type="button" title="Add project"><svg class="icon"><use href="#i-plus" /></svg></button>
              </div>
              <div id="project-list" class="items"></div>
            </section>
          </nav>

          <footer class="sb-foot">
            <button id="settings" class="icon-btn" type="button" title="Settings" aria-label="Settings"><svg class="icon"><use href="#i-gear" /></svg></button>
            <button id="updates" class="icon-btn has-badge" type="button" title="Updates" aria-label="Updates"><svg class="icon"><use href="#i-refresh" /></svg><span id="update-dot" class="badge-dot" hidden></span></button>
            <button id="export" class="icon-btn" type="button" title="Export chats" aria-label="Export chats"><svg class="icon"><use href="#i-download" /></svg></button>
            <span class="spacer"></span>
            <span id="host-info" class="meta"></span>
          </footer>
        </aside>

        <main id="main">
          <header id="topbar">
            <button id="menu" class="icon-btn" type="button" aria-label="Sessions"><svg class="icon"><use href="#i-menu" /></svg></button>
            <div class="tb-tab">
              <span id="conv-title">New session</span>
              <button id="conv-menu" class="icon-btn" type="button" title="Session menu" aria-label="Session menu"><svg class="icon"><use href="#i-more" /></svg></button>
            </div>
            <div class="tb-right">
              <button id="ctx-ring" class="ctx-ring" type="button" title="Context usage">
                <svg class="ctx-circle" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5" /><circle id="ctx-arc" cx="10" cy="10" r="7.5" pathLength="100" /></svg>
                <span id="ctx-pct">–</span>
              </button>
              <button id="toggle-session" class="icon-btn" type="button" title="Work-status panel" aria-label="Work-status panel"><svg class="icon"><use href="#i-sliders" /></svg></button>
            </div>
          </header>

          <div class="workarea">
            <section id="chat-col">
              <div id="scroll">
                <div id="empty" class="empty">
                  <div class="empty-inner">
                    <h1>What are we working on?</h1>

                    <div class="project-choose">
                      <button id="choose-project" type="button">Choose project<svg class="icon"><use href="#i-chevron-down" /></svg></button>
                      <div id="project-menu" class="menu sheet" hidden></div>
                    </div>

                    <div id="composer-slot-empty"></div>

                    <div id="suggestions" class="chips">
                      <button class="chip" type="button" data-prompt="Explore the codebase and tell me how it is structured."><svg class="icon"><use href="#i-search" /></svg>Explore the codebase</button>
                      <button class="chip" type="button" data-prompt="Catch me up on what changed recently in this project."><svg class="icon"><use href="#i-clock" /></svg>Catch me up</button>
                      <button class="chip" type="button" data-prompt="Weigh the options for what I should do next here."><svg class="icon"><use href="#i-sliders" /></svg>Weigh my options</button>
                      <button class="chip" type="button" data-prompt="Help me plan a feature for this project."><svg class="icon"><use href="#i-map" /></svg>Start feature planning</button>
                      <button class="chip" type="button" data-prompt="Set a goal for this session and work towards it."><svg class="icon"><use href="#i-target" /></svg>Craft a Goal</button>
                      <button class="chip" type="button" data-prompt="Schedule a task to run on an interval."><svg class="icon"><use href="#i-clock" /></svg>Schedule a Task</button>
                      <button class="chip" type="button" data-prompt="Debug the current issue in this project."><svg class="icon"><use href="#i-terminal" /></svg>Debug an issue</button>
                      <button class="chip" type="button" data-prompt="Review my uncommitted changes."><svg class="icon"><use href="#i-diff" /></svg>Review my changes</button>
                      <button class="chip" type="button" data-prompt="Show me what TheChambers can do."><svg class="icon"><use href="#i-spark" /></svg>TheChambers</button>
                      <button id="add-starter" class="chip square" type="button" title="Add a starter"><svg class="icon"><use href="#i-plus" /></svg></button>
                    </div>
                  </div>
                </div>

                <div id="thread" class="thread" hidden></div>
              </div>

              <div id="composer-dock" class="composer-dock" hidden></div>
            </section>

            <aside id="panel" class="panel" hidden>
              <header class="panel-head">
                <div id="panel-tabs" class="panel-tabs"></div>
                <div id="panel-actions" class="panel-actions"></div>
              </header>
              <div id="panel-body" class="panel-body"></div>
            </aside>

            <aside id="session-panel" class="session-panel" hidden>
              <div id="session-card" class="session-card"></div>
            </aside>

            <nav id="rail" class="rail" aria-label="Panel surfaces">
              <button data-panel="context" type="button" title="Context"><svg class="icon"><use href="#i-chart" /></svg></button>
              <div class="rail-sep"></div>
              <button data-panel="git" type="button" title="Git"><svg class="icon"><use href="#i-git" /></svg></button>
              <button data-panel="changes" type="button" title="Changes"><svg class="icon"><use href="#i-diff" /></svg></button>
              <button data-panel="walkthrough" type="button" title="Walkthrough"><svg class="icon"><use href="#i-map" /></svg></button>
              <div class="rail-sep"></div>
              <button data-panel="files" type="button" title="Files"><svg class="icon"><use href="#i-file" /></svg></button>
              <button data-panel="terminal" type="button" title="Terminal"><svg class="icon"><use href="#i-terminal" /></svg></button>
              <button data-panel="browser" type="button" title="Browser"><svg class="icon"><use href="#i-globe" /></svg></button>
              <div class="rail-sep"></div>
              <button data-panel="knowledge" type="button" title="Project knowledge"><svg class="icon"><use href="#i-book" /></svg></button>
              <button id="rail-config" type="button" title="Configure panels"><svg class="icon"><use href="#i-sliders" /></svg></button>
              <span class="spacer"></span>
            </nav>
          </div>
        </main>
      </div>

      <div id="scrim" hidden></div>
      <div id="toast" class="toast" hidden></div>
      <div id="modal-root"></div>

      <form id="composer" class="composer" autocomplete="off">
        <div class="composer-card">
          <div id="attachments" class="attachments" hidden></div>
          <textarea id="input" rows="1" placeholder="Plan, build, or ask. @ to mention, $ for skills, / for commands"></textarea>
          <div class="composer-bar">
            <button id="attach" class="icon-btn" type="button" title="Add attachment" aria-label="Add attachment"><svg class="icon"><use href="#i-plus-circle" /></svg></button>
            <button id="permissions" class="icon-btn" type="button" title="Permissions" aria-label="Permissions"><svg class="icon"><use href="#i-shield" /></svg></button>
            <button id="goal" class="icon-btn" type="button" title="Start a goal with the next message" aria-label="Start a goal"><svg class="icon"><use href="#i-target" /></svg></button>
            <button id="concise" class="icon-btn" type="button" title="Concise mode — fewer words, less repeated work" aria-label="Concise mode"><svg class="icon"><use href="#i-concise" /></svg></button>
            <span class="spacer"></span>
            <button id="model-btn" class="bar-btn" type="button" title="Model"><svg class="icon"><use href="#i-cpu" /></svg><span id="model-label">Command Code / default</span><svg class="icon caret"><use href="#i-chevron-down" /></svg></button>
            <button id="agent-btn" class="bar-btn agent" type="button" title="Agent"><span class="agent-dot"></span><span id="agent-label">Build</span><svg class="icon caret"><use href="#i-chevron-down" /></svg></button>
            <button id="queue" class="bar-btn action" type="button" title="Send this after the current turn" hidden>Queue</button>
            <button id="steer" class="bar-btn action" type="button" title="Stop the current turn and send this instead" hidden>Steer</button>
            <button id="stop" class="send stop" type="button" aria-label="Stop" hidden>■</button>
            <button id="send" class="send" type="submit" aria-label="Send" disabled><svg class="icon"><use href="#i-send" /></svg></button>
          </div>
        </div>
        <input id="file-input" type="file" hidden multiple />
        <div id="composer-menu" class="menu sheet" hidden></div>
      </form>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
